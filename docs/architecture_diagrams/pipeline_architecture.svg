<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Conveyor defect detection pipeline architecture</title>
<desc>Seven-component pipeline: synthetic frame generation, MOG2 background subtraction, feature extraction with area filtering, Kalman tracking, CNN classification, and annotated output, with a separate offline evaluation harness that validated the CNN at 89.63% test accuracy.</desc>
<style>
  .box { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
  .box-gray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; stroke-dasharray: 4 4; }
  .title { fill: #085041; font: 500 14px sans-serif; }
  .subtitle { fill: #0F6E56; font: 400 12px sans-serif; }
  .title-gray { fill: #2C2C2A; font: 500 14px sans-serif; }
  .subtitle-gray { fill: #444441; font: 400 12px sans-serif; }
  .arrow-line { stroke: #444444; stroke-width: 1.5; fill: none; }
  .leader-line { stroke: #888888; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  .caption { fill: #666666; font: 400 12px sans-serif; }
  @media (prefers-color-scheme: dark) {
    .box { fill: #04342C; stroke: #5DCAA5; }
    .box-gray { fill: #2C2C2A; stroke: #B4B2A9; }
    .title { fill: #9FE1CB; }
    .subtitle { fill: #5DCAA5; }
    .title-gray { fill: #D3D1C7; }
    .subtitle-gray { fill: #B4B2A9; }
    .arrow-line { stroke: #CCCCCC; }
    .leader-line { stroke: #999999; }
    .caption { fill: #AAAAAA; }
  }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect class="box" x="40" y="60" width="140" height="56" rx="8"/>
<text class="title" x="110" y="82" text-anchor="middle">Component 1</text>
<text class="subtitle" x="110" y="100" text-anchor="middle">Synthetic frames</text>

<rect class="box" x="196" y="60" width="140" height="56" rx="8"/>
<text class="title" x="266" y="82" text-anchor="middle">Component 2</text>
<text class="subtitle" x="266" y="100" text-anchor="middle">MOG2 subtraction</text>

<rect class="box" x="352" y="60" width="150" height="56" rx="8"/>
<text class="title" x="427" y="82" text-anchor="middle">Component 3</text>
<text class="subtitle" x="427" y="100" text-anchor="middle">Extract &amp; filter</text>

<rect class="box" x="518" y="60" width="120" height="56" rx="8"/>
<text class="title" x="578" y="82" text-anchor="middle">Component 4</text>
<text class="subtitle" x="578" y="100" text-anchor="middle">Track &amp; gate</text>

<line class="arrow-line" x1="180" y1="88" x2="194" y2="88" marker-end="url(#arrow)"/>
<line class="arrow-line" x1="336" y1="88" x2="350" y2="88" marker-end="url(#arrow)"/>
<line class="arrow-line" x1="502" y1="88" x2="516" y2="88" marker-end="url(#arrow)"/>

<rect class="box" x="196" y="220" width="170" height="56" rx="8"/>
<text class="title" x="281" y="242" text-anchor="middle">Component 5</text>
<text class="subtitle" x="281" y="260" text-anchor="middle">CNN classification</text>

<rect class="box" x="382" y="220" width="155" height="56" rx="8"/>
<text class="title" x="459" y="242" text-anchor="middle">Output</text>
<text class="subtitle" x="459" y="260" text-anchor="middle">Frames + CSV log</text>

<path class="arrow-line" d="M578 116 L578 180 L281 180 L281 218" marker-end="url(#arrow)"/>
<text class="caption" x="430" y="166" text-anchor="middle">on confirm + best crop</text>

<line class="arrow-line" x1="366" y1="248" x2="380" y2="248" marker-end="url(#arrow)"/>

<rect class="box-gray" x="382" y="320" width="180" height="56" rx="8"/>
<text class="title-gray" x="472" y="342" text-anchor="middle">Component 6</text>
<text class="subtitle-gray" x="472" y="360" text-anchor="middle">89.63% test accuracy</text>

<path class="leader-line" d="M281 276 L472 320"/>
<circle cx="281" cy="276" r="2" fill="#888888"/>
<text class="caption" x="490" y="300" text-anchor="start">validates same model, offline</text>

<text class="caption" x="40" y="404" text-anchor="start">Solid teal = live per-frame pipeline. Dashed gray = offline validation, not run per-frame.</text>
</svg>
